<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rezervacija – Osobni podaci (1/3)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a href="apartmani.html">Ponuda smještaja</a>
      <a href="lavanda.html">Detalji apartmana</a>
      <a href="rezervacija.html">Rezervacija</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="o-nama.html">O nama</a>
      <a href="cjenik.html">Cjenik</a>
    </nav>

    <main>
      <h1>Rezervacija apartmana</h1>

      <ol class="koraci">
        <li class="aktivan">Osobni podaci</li>
        <li>Adresa</li>
        <li>Boravak</li>
      </ol>

      <form class="obrazac" action="obrazac2.html" method="get">
        <fieldset>
          <legend>Osobni podaci</legend>

          <div class="red">
            <div class="polje">
              <label for="ime">Ime <span class="obavezno">*</span></label>
              <input
                type="text"
                id="ime"
                name="ime"
                autocomplete="given-name"
                required
              />
            </div>
            <div class="polje">
              <label for="prezime"
                >Prezime <span class="obavezno">*</span></label
              >
              <input
                type="text"
                id="prezime"
                name="prezime"
                autocomplete="family-name"
                required
              />
            </div>
          </div>

          <div class="red">
            <div class="polje">
              <label for="datum_rodenja">Datum rođenja</label>
              <input type="date" id="datum_rodenja" name="datum_rodenja" />
            </div>
            <div class="polje">
              <label for="drzavljanstvo"
                >Državljanstvo <span class="obavezno">*</span></label
              >
              <select id="drzavljanstvo" name="drzavljanstvo" required>
                <option value="">– odaberite –</option>
                <option>Hrvatsko</option>
                <option>Bosanskohercegovačko</option>
                <option>Slovensko</option>
                <option>Srpsko</option>
                <option>Njemačko</option>
                <option>Austrijsko</option>
                <option>Talijansko</option>
                <option>Poljsko</option>
                <option>Ostalo</option>
              </select>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Kontakt</legend>

          <div class="red">
            <div class="polje">
              <label for="email">E-mail <span class="obavezno">*</span></label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="ime@primjer.hr"
                autocomplete="email"
                required
              />
            </div>
            <div class="polje">
              <label for="telefon"
                >Telefon <span class="obavezno">*</span></label
              >
              <input
                type="tel"
                id="telefon"
                name="telefon"
                placeholder="+385 91 123 4567"
                autocomplete="tel"
                required
              />
            </div>
          </div>

          <div class="polje">
            <span class="oznaka">Kako vas najradije kontaktiramo?</span>
            <div class="izbori">
              <label
                ><input type="radio" name="kontakt" value="email" checked />
                E-mail</label
              >
              <label
                ><input type="radio" name="kontakt" value="telefon" />
                Telefon</label
              >
              <label
                ><input type="radio" name="kontakt" value="whatsapp" /> WhatsApp
                / Viber</label
              >
            </div>
          </div>

          <div class="polje">
            <label for="jezik">Jezik komunikacije</label>
            <select id="jezik" name="jezik">
              <option>Hrvatski</option>
              <option>Engleski</option>
              <option>Njemački</option>
              <option>Talijanski</option>
            </select>
          </div>
        </fieldset>

        <p class="napomena"><span class="obavezno">*</span> Obavezna polja</p>

        <div class="gumbi">
          <a class="gumb sporedni" href="rezervacija.html">Odustani</a>
          <button class="gumb" type="submit">Dalje</button>
        </div>
      </form>
    </main>
  </body>
</html>
