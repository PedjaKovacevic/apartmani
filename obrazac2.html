<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rezervacija – Adresa (2/3)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a href="apartmani.html">Ponuda smještaja</a>
      <a href="lavanda.html">Detalji apartmana</a>
      <a href="rezervacija.html">Rezervacija</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="o-nama.html">O nama</a>
      <a href="cjenik.html">Cjenik</a>
    </nav>

    <main>
      <h1>Rezervacija apartmana</h1>

      <ol class="koraci">
        <li class="gotov">Osobni podaci</li>
        <li class="aktivan">Adresa</li>
        <li>Boravak</li>
      </ol>

      <form class="obrazac" action="obrazac3.html" method="get">
        <fieldset>
          <legend>Adresa stanovanja</legend>

          <div class="polje">
            <label for="adresa">Ulica i kućni broj <span class="obavezno">*</span></label>
            <input type="text" id="adresa" name="adresa" autocomplete="street-address" required />
          </div>

          <div class="red">
            <div class="polje uzi">
              <label for="postanski_broj">Poštanski broj <span class="obavezno">*</span></label>
              <input type="text" id="postanski_broj" name="postanski_broj" inputmode="numeric" autocomplete="postal-code" required />
            </div>
            <div class="polje">
              <label for="grad">Grad <span class="obavezno">*</span></label>
              <input type="text" id="grad" name="grad" autocomplete="address-level2" required />
            </div>
          </div>

          <div class="polje">
            <label for="drzava">Država <span class="obavezno">*</span></label>
            <select id="drzava" name="drzava" autocomplete="country-name" required>
              <option value="">– odaberite –</option>
              <option>Hrvatska</option>
              <option>Bosna i Hercegovina</option>
              <option>Slovenija</option>
              <option>Srbija</option>
              <option>Njemačka</option>
              <option>Austrija</option>
              <option>Italija</option>
              <option>Poljska</option>
              <option>Ostalo</option>
            </select>
          </div>
        </fieldset>

        <fieldset>
          <legend>Podaci za račun</legend>

          <div class="polje">
            <span class="oznaka">Račun glasi na</span>
            <div class="izbori">
              <label><input type="radio" name="racun" value="privatno" checked /> Privatnu osobu</label>
              <label><input type="radio" name="racun" value="tvrtka" /> Tvrtku</label>
            </div>
          </div>

          <div class="red">
            <div class="polje">
              <label for="tvrtka">Naziv tvrtke</label>
              <input type="text" id="tvrtka" name="tvrtka" autocomplete="organization" />
            </div>
            <div class="polje">
              <label for="oib">OIB / porezni broj</label>
              <input type="text" id="oib" name="oib" inputmode="numeric" />
            </div>
          </div>
          <p class="pomoc">Ova polja ispunite samo ako račun glasi na tvrtku.</p>
        </fieldset>

        <p class="napomena"><span class="obavezno">*</span> Obavezna polja</p>

        <div class="gumbi">
          <a class="gumb sporedni" href="obrazac1.html">Natrag</a>
          <button class="gumb" type="submit">Dalje</button>
        </div>
      </form>
    </main>
  </body>
</html>
